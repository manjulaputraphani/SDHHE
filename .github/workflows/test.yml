name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm test

      # The web app and the Cloudflare Worker are separate packages — they are
      # deployed on their own, so they get their own typecheck here.
      - name: install web dependencies
        run: npm ci --prefix web

      - name: typecheck (web)
        run: npm run typecheck --prefix web

      - name: install worker dependencies
        run: npm ci --prefix web-worker

      - name: typecheck (worker)
        run: npx tsc --noEmit
        working-directory: web-worker
