name: android-apk

# Builds the Expo Android app directly on the GitHub runner, so no EAS
# credentials are needed. The resulting APK is debug-signed (the Expo
# prebuild template signs release builds with the local debug key) and is
# meant for testing/direct install, not the Play Store.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Expo SDK 58 compiles against Android API 37 and uses NDK 27.1.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Stage APK artifact
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk SDHHE-Mobile.apk
          sha256sum SDHHE-Mobile.apk > SDHHE-Mobile.apk.sha256
          ls -lh SDHHE-Mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDHHE-Mobile-apk
          path: |
            SDHHE-Mobile.apk
            SDHHE-Mobile.apk.sha256
          if-no-files-found: error
          retention-days: 30
