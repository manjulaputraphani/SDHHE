name = "sdhhe-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Secrets (set with `wrangler secret put`, never committed):
#   DATABASE_URL  — Neon connection string
#   SESSION_SECRET — signing key for login sessions

[assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = true

# Receipt files (Phase 12) — the paperwork never goes into Postgres.
# Create the bucket once: `npx wrangler r2 bucket create sdhhe-receipts`
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "sdhhe-receipts"

# The Team Chat room (Phase 12) — one Durable Object for the whole shop.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]
