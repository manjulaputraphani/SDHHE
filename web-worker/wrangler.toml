name = "sdhhe-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Secrets (set with `wrangler secret put`, never committed):
#   DATABASE_URL  — Neon connection string
#   SESSION_SECRET — signing key for login sessions
#   FCM_SERVICE_ACCOUNT — the Firebase service-account JSON (FCM v1, web push)

[assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = true

# Receipt files (Phase 12) — the paperwork never goes into Postgres.
# Create the bucket once: `npx wrangler r2 bucket create sdhhe-receipts`
# (The deploy on 2026-11-06 went out WITHOUT this binding, because R2 is not
#  enabled on the account yet. Re-run `wrangler deploy` once R2 is on.)
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "sdhhe-receipts"

# The Team Chat room (Phase 12) — one Durable Object for the whole shop.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# Phase 17 — the database moved from Neon Postgres to Cloudflare D1.
# (The DATABASE_URL secret stays until the cutover in T-17.5.)
[[d1_databases]]
binding = "DB"
database_name = "sdhhe"
database_id = "a111542a-461f-4cda-a756-a5eca215ca48"
